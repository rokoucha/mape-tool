name: Build

on:
  workflow_dispatch:
    inputs:
      push:
        description: Create a GitHub release
        type: boolean
        required: false
        default: false
      version_tag:
        description: Release version tag used for artifacts
        type: string
        required: false
  workflow_call:
    inputs:
      push:
        description: Create a GitHub release
        type: boolean
        required: false
        default: false
      version_tag:
        description: Release version tag used for artifacts
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
          - GOOS: linux
            GOARCH: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o "./${OUTPUT_NAME}" ./cmd/mape-tool
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.GOARCH }}
          GOOS: ${{ matrix.GOOS }}
          OUTPUT_NAME: mape-tool-${{ matrix.GOOS }}-${{ matrix.GOARCH }}

      - name: Upload build result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mape-tool-${{ inputs.version_tag != '' && format('{0}-', inputs.version_tag) || '' }}${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: mape-tool-${{ matrix.GOOS }}-${{ matrix.GOARCH }}

  release:
    if: inputs.push && inputs.version_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: mape-tool-${{ inputs.version_tag }}-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum mape-tool-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          gh release create "$VERSION_TAG" dist/mape-tool-* dist/SHA256SUMS \
            --generate-notes \
            --latest \
            --target "$GITHUB_SHA" \
            --title "$VERSION_TAG"
